# 2D Euler solver configuration

dim = 2

# Global mesh; ng >= 1 for firstOrder, 2 for muscl, 3 for weno5.
nx = 400
ny = 200
ng = 4

x0 = 0.0
x1 = 1.0
y0 = 0.0
y1 = 0.2

# Gas model and time control
gamma = 1.4
cfl = 0.2
finalTime = 0.2

flux = hllc                       # rusanov | hllc | ausm | godunov
timeIntegrator = rk4              # euler | rk2 | ssprk3 | rk4

# Each local block must have nx >= ng and ny >= ng; px * py must equal the MPI rank count.
mpi.px = 1
mpi.py = 1

# Reconstruction
reconstruction.scheme = weno5     # firstOrder | muscl | weno5
reconstruction.limiter = vanleer  # none | minmod | vanleer; MUSCL only
reconstruction.eps = 1e-12        # Jiang-Shu weight epsilon; WENO5 only

# Physical boundaries: zeroGradient | slipWall | symmetry | inlet | outlet.
# Per-side types override bc; MPI interfaces are handled by the solver.
bc = zeroGradient
bc.left = zeroGradient
bc.right = zeroGradient
bc.bottom = zeroGradient
bc.top = zeroGradient

# Required when an inlet is selected; replace bc.inlet. with bc.<side>.inlet. for a side override.
# Any side-specific inlet key requires all four side-specific values.
# bc.inlet.rho = 1.0
# bc.inlet.u = 0.0
# bc.inlet.v = 0.0
# bc.inlet.p = 1.0

# Required when an outlet is selected; bc.<side>.outlet.p overrides this value.
# bc.outlet.p = 1.0

# Sod-x initial field; later regions overwrite earlier ones where cell centers lie inside their bounds.
setFields.bg.rho = 0.125
setFields.bg.u = 0.0
setFields.bg.v = 0.0
setFields.bg.p = 0.1

setFields.nRegions = 1

setFields.region1.xMin = 0.0
setFields.region1.xMax = 0.5
setFields.region1.yMin = 0.0
setFields.region1.yMax = 0.2
setFields.region1.rho = 1.0
setFields.region1.u = 0.0
setFields.region1.v = 0.0
setFields.region1.p = 1.0

# Optional post-shock state: rho/u/v/p specify the upstream gas; Mach is relative to that gas.
# Positive shockMach activates this mode and must exceed one; omit it for direct primitive input.
# setFields.region1.shockMach = 2.0
# setFields.region1.shockDir = +x    # +x | -x | +y | -y

# Output is written under solution/; outputEvery <= 0 disables scheduled snapshots.
outPrefix = solution
outputEvery = 20
writeFinal = true
output.vtkDataOutputType = point   # point: grid-point averages | cell: direct cell values
